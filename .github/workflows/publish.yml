name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: Build sdist, then wheel from the sdist
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install and test the wheel
        shell: pwsh
        run: |
          $wheel = (Get-Item dist/*.whl).FullName
          python -m pip install --no-deps $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Check installed entry point and release version
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import json, os, subprocess
          from importlib.metadata import version
          from importlib.resources import files

          package_version = version("gta-rpf-mcp")
          tag = os.environ.get("RELEASE_TAG")
          if tag and tag != f"v{package_version}":
              raise SystemExit(f"Release {tag} does not match distribution {package_version}")
          resources = files("gta_rpf_mcp")
          for name in ("bridge.ps1", "release-pins.json"):
              assert resources.joinpath(name).is_file(), name
          messages = [
              {"id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}}},
              {"method": "notifications/initialized"},
              {"id": 2, "method": "tools/list"},
          ]
          payload = "".join(json.dumps({"jsonrpc": "2.0", **m}) + "\n" for m in messages)
          run = subprocess.run(["gta-rpf-mcp"], input=payload, capture_output=True, text=True, check=True, timeout=20)
          hello, tools = map(json.loads, run.stdout.splitlines())
          assert hello["result"]["serverInfo"] == {"name": "gta-rpf-mcp", "version": package_version}
          assert {t["name"] for t in tools["result"]["tools"]} == {"gta_rpf_prepare", "gta_rpf_status"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && github.repository == 'GlossMod/gta-rpf-mcp'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gta-rpf-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
