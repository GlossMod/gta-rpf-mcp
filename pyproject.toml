[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-rpf-mcp"
dynamic = ["version"]
description = "Prepare isolated Grand Theft Auto V Legacy mod archive jobs for Agent Mod Manager"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Repository = "https://github.com/GlossMod/gta-rpf-mcp"
Issues = "https://github.com/GlossMod/gta-rpf-mcp/issues"

[tool.setuptools.dynamic]
version = {attr = "gta_rpf_mcp.__version__"}

[project.scripts]
gta-rpf-mcp = "gta_rpf_mcp.server:main"

[tool.setuptools.package-data]
gta_rpf_mcp = ["bridge.ps1", "release-pins.json"]
